     <h2>Ajouter un produit</h2>
    
    <form th:action="@{/produits/add}" th:object="${produit}" method="post">
        
        <!-- Champ Nom -->
        <div class="mb-3 row">
            <div class="col-4">
                <input type="text" th:field="*{nom}" class="form-control" id="nom" placeholder="Nom du produit">
            </div>
        </div>

        <!-- Champ Description -->
        <div class="mb-3 row">
            <div class="col-4">
                <input type="text" th:field="*{description}" class="form-control" id="description" placeholder="Description du produit">
            </div>
        </div>

        <!-- Champ Prix -->
        <div class="mb-3 row">
            <div class="col-4">
                <input type="number" th:field="*{prix}" step="0.01" class="form-control" id="prix" placeholder="Prix du produit">
            </div>
        </div>

        <!-- Bouton Enregistrer -->
        <div class="mb-3 row">
            <div class="col-sm-10 offset-sm-2">
                <button type="submit" class="btn btn-primary">Enregistrer</button>
            </div>
        </div>
    </form>

    <!-- Bootstrap JS (optionnel pour interactions dynamiques) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
